[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bananadeath-ml"
version = "0.1.0"
description = "Data audit, training, evaluation, and inference for Banana Death."
requires-python = ">=3.11"

[tool.setuptools]
package-dir = { "bananadeath_ml" = "src" }
packages = ["bananadeath_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
